<!DOCTYPE html>
<html>

<head>
    <title>Crop Scanner - SmartCrop AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <div class="logo">
            🌱 SmartCrop AI
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="scanner.html">Crop Scanner</a>
            <a href="iot.html">IoT Monitoring</a>
            <a href="spraying.html">Spraying</a>
            <a href="analytics.html">Analytics</a>
            <a href="history.html">History</a>

        </div>

    </nav>


    <section class="hero">

        <h1>📷 Crop Health Scanner</h1>

        <p>
            Upload a potato leaf image to check
            whether the plant is Healthy or Diseased.
        </p>

    </section>


    <section class="card scanner-box">

        <h2>🥔 Upload Potato Leaf Image</h2>

        <input
            type="file"
            id="cropImage"
            accept="image/*"
        >

        <br><br>

        <img
            id="preview"
            style="max-width:300px; display:none; border-radius:15px;"
        >

        <br><br>

        <button
            type="button"
            class="button"
            id="analyzeButton"
        >
            🤖 Analyze Crop
        </button>

    </section>


    <section class="card scanner-box">

        <h2>🔍 AI Detection Result</h2>

        <div id="result">

            <p>
                Upload an image and click
                <b>Analyze Crop</b>.
            </p>

        </div>

    </section>


    <script>

        const cropImage = document.getElementById("cropImage");
        const preview = document.getElementById("preview");
        const analyzeButton = document.getElementById("analyzeButton");
        const result = document.getElementById("result");


        // Show selected image
        cropImage.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";

        });


        // Real AI prediction
        analyzeButton.addEventListener("click", async function (event) {

            event.preventDefault();


            const image = cropImage.files[0];


            if (!image) {

                alert("⚠️ Please upload a potato leaf image first.");
                return;

            }


            result.innerHTML = `
                <p>🤖 AI analyzing crop...</p>
            `;


            const formData = new FormData();

            formData.append("image", image);


            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/predict",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const data = await response.json();


                if (!response.ok || data.status !== "success") {

                    throw new Error(
                        data.message || "AI prediction failed"
                    );

                }


                if (data.result === "Healthy") {

                    result.innerHTML = `

                        <h2>🟢 Healthy</h2>

                        <p>
                            <b>Plant ID:</b>
                            ${data.plant_id}
                        </p>

                        <p>
                            <b>AI Confidence:</b>
                            ${data.confidence}%
                        </p>

                        <p>
                            No visible crop health problem detected.
                        </p>

                        <p>
                            <b>Spraying:</b>
                            ❌ Not Required
                        </p>

                    `;

                } else {

                    result.innerHTML = `

                        <h2>🔴 Diseased / Defected</h2>

                        <p>
                            <b>Plant ID:</b>
                            ${data.plant_id}
                        </p>

                        <p>
                            <b>AI Confidence:</b>
                            ${data.confidence}%
                        </p>

                        <p>
                            Possible crop health problem detected.
                        </p>

                        <p>
                            <b>Spraying:</b>
                            ✅ Required
                        </p>

                    `;

                }


            } catch (error) {

                console.error(error);

                result.innerHTML = `

                    <p style="color:red;">
                        ⚠️ AI prediction failed.
                    </p>

                    <p style="color:#64748b;">
                        ${error.message}
                    </p>

                `;

            }

        });

    </script>

</body>

</html>
